<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6B47">
<title>Finlora Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Sign-in screen: shown until Firebase reports a signed-in user -->
<div id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="brand" style="padding:0"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V8a3 3 0 0 1 3-3h8"/><path d="M5 12h9"/><path d="M14 19a5 5 0 0 0 5-5"/></svg></div><div><b>Moss</b><span>Budget tracker</span></div></div>
    <div>
      <h1 id="auth-title">Log in</h1>
      <p class="muted" id="auth-sub" style="margin:6px 0 0">Your budget, cards and bills, saved to your account.</p>
    </div>
    <button type="button" class="btn google" id="auth-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="or"><span>or use email</span></div>
    <form id="auth-form" novalidate>
      <label class="field" for="auth-email">Email<input id="auth-email" class="input" type="email" autocomplete="email" required></label>
      <label class="field" for="auth-pass">Password<input id="auth-pass" class="input" type="password" autocomplete="current-password" minlength="6" required></label>
      <p class="err" id="auth-err" hidden></p>
      <p class="ok-msg" id="auth-ok" hidden></p>
      <button type="submit" class="btn primary" id="auth-submit">Log in</button>
    </form>
    <div class="auth-links">
      <button type="button" class="linkbtn" id="auth-switch">New here? Create an account</button>
      <button type="button" class="linkbtn" id="auth-reset">Forgot password?</button>
    </div>
  </div>
</div>

<div id="loading" class="auth"><p class="muted">Loading…</p></div>

<div class="app" id="app" hidden>
  <div class="mob mtop">
    <div class="brand"><div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V8a3 3 0 0 1 3-3h8"/><path d="M5 12h9"/><path d="M14 19a5 5 0 0 0 5-5"/></svg></div><div><b>Moss</b><span id="m-total" class="num">Budget tracker</span></div></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="month" aria-label="Month"><button data-act="prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span class="m-label" style="min-width:72px;font-size:13px"></span><button data-act="next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
      <button class="iconbtn logout-btn" data-act="logout" aria-label="Log out"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </div>

  <aside class="side">
    <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V8a3 3 0 0 1 3-3h8"/><path d="M5 12h9"/><path d="M14 19a5 5 0 0 0 5-5"/></svg></div><div><b>Moss</b><span>Budget tracker</span></div></div>
    <button class="btn dark" data-act="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add expense</button>
    <nav aria-label="Main">
      <span class="navlbl">BUDGET</span>
      <a href="#overview" data-nav="overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
      <a href="#stats" data-nav="stats"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistics</a>
      <a href="#activity" data-nav="activity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Activity</a>
      <a href="#budgets" data-nav="budgets"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Budgets</a>
      <span class="navlbl" style="padding-top:14px">MONEY</span>
      <a href="#accounts" data-nav="accounts"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14h.01"/></svg>My money</a>
      <a href="#cards" data-nav="cards"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>Cards</a>
    </nav>
    <div class="userbox">
      <div class="avatar" id="u-avatar" aria-hidden="true">?</div>
      <div style="min-width:0;flex:1">
        <b id="u-name">Signed in</b>
        <span id="sync-txt">Connecting…</span>
      </div>
      <span class="dot" id="sync-dot" style="background:var(--track)"></span>
    </div>
    <button class="btn small logout-btn" data-act="logout"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Log out</button>
  </aside>

  <main>
    <div class="topbar deskonly">
      <div class="hello"><b id="greet">Hello</b><span id="today-lbl"></span></div>
      <div class="month" aria-label="Month"><button data-act="prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span class="m-label"></span><button data-act="next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
    </div>
    <div id="view"></div>
  </main>

  <nav class="mob tabbar" aria-label="Main mobile">
    <a href="#overview" data-nav="overview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="#accounts" data-nav="accounts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14h.01"/></svg>Money</a>
    <a href="#cards" data-nav="cards"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>Cards</a>
    <button class="fab" data-act="add" aria-label="Add expense"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#stats" data-nav="stats"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
    <a href="#budgets" data-nav="budgets"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Budgets</a>
  </nav>
</div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden></div>

<script type="module" src="./main.js"></script>
</body>
</html>
